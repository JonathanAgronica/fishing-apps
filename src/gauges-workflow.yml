name: Update Baffle Creek gauges
on:
  schedule:
    - cron: '23 * * * *'   # hourly at :23 UTC (= :23 AEST)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: gauges
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch BoM + DES, merge, recompute lags
        run: python3 scripts/update_gauges.py
      - name: Commit if changed
        run: |
          git config user.name "fish-times-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "gauges: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
